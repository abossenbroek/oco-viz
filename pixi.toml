[project]
name = "oco-viz"
version = "0.1.0"
description = "3D volumetric CO2 plume visualization for OCO-3 data"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.11,<3.13"
mesalib = "*"
vtk = ">=9.3"
numpy = ">=1.26"
pydantic = ">=2"
pyyaml = ">=6"
attrs = ">=24"
xarray = ">=2024"
zarr = ">=2.16"
scipy = ">=1.12"
openvdb = ">=13"

[pypi-dependencies]
oco-viz = { path = ".", editable = true }

[tasks]
lint = "ruff check src/ tests/"
typecheck = "mypy src/ && pyright src/"
test = "pytest tests/ -x"
check = { depends-on = ["lint", "typecheck", "test"] }

[feature.dev.dependencies]
ruff = ">=0.8"
mypy = ">=1.13"
pyright = ">=1.1"
pytest = ">=8"
pre-commit = ">=4"
pillow = ">=10"
types-pyyaml = ">=6"
pytest-cov = ">=5"

[environments]
default = { features = ["dev"], solve-group = "default" }
