[project]
name = "oco-viz"
version = "0.1.0"
description = "3D volumetric CO2 plume visualization for OCO-3 data"
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[dependencies]
python = ">=3.11,<3.13"
mesalib = "*"
vtk = ">=9.3"
numpy = ">=1.26"
pydantic = ">=2"
pyyaml = ">=6"
attrs = ">=24"
xarray = ">=2024"
zarr = ">=2.16"
scipy = ">=1.12"
netcdf4 = ">=1.6"
requests = ">=2.31"
openvdb = ">=13"
structlog = ">=25.5.0,<26"

[pypi-dependencies]
oco-viz = { path = ".", editable = true }
cdsapi = ">=0.7"

[tasks]
lint = "ruff check src/ tests/"
format-check = "ruff format --check --diff src/ tests/ scripts/"
import-sort = "ruff check --select I src/ tests/ scripts/"
typecheck = "mypy src/ && pyright src/"
mypy = "mypy src/"
pyright = "pyright src/"
test = "pytest tests/ -x"
spell = "typos"
dead-code = "vulture src/ tests/ scripts/ --min-confidence 80"
complexity = "radon cc src/ --min D --json | python -c \"import sys,json; d=json.load(sys.stdin); blocks=[b for fs in d.values() for b in fs if b['complexity']>15]; [print(f\\\"CC={b['complexity']} {b['type']} {b['name']} in {b['filename']}:{b['lineno']}\\\") for b in blocks]; sys.exit(1 if blocks else 0)\""
yaml-lint = "yamllint -c .yamllint.yml configs/ plan/ .github/"
dockerfile-lint = "bash -c 'command -v hadolint >/dev/null 2>&1 || { echo \"hadolint not found — install via: brew install hadolint\"; exit 1; }; hadolint Dockerfile'"
file-size = "bash -c 'big=$(find . -type f -size +1M -not -path \"./.git/*\" -not -path \"./.pixi/*\" -not -path \"./.mypy_cache/*\" -not -path \"./.pytest_cache/*\" -not -name \"pixi.lock\" -not -path \"./tests/fixtures/*\" -not -path \"./plan/idea_board/*\" -not -name \"*_roles.json\" -not -name \"*_expertise.json\" -not -name \"artist_stand_on_shoulder.*\" -not -name \"artist_references.yaml\"); if [ -n \"$big\" ]; then echo \"Files >1MB:\" && echo \"$big\" && exit 1; fi'"
future-annotations = "bash -c 'fail=0; for f in $(find src/ -name \"*.py\"); do head -20 \"$f\" | grep -q \"from __future__ import annotations\" || { echo \"Missing future annotations: $f\"; fail=1; }; done; exit $fail'"
py-typed = "test -f src/oco_viz/py.typed"
commit-lint = "bash -c 'eval \"$(mise activate bash)\" && bun x --bun commitlint -- --from=HEAD~1 --to=HEAD'"
fix = "ruff format src/ tests/ scripts/ && ruff check --fix src/ tests/"
check = { depends-on = ["lint", "typecheck", "test"] }
ci = { depends-on = ["format-check", "import-sort", "lint", "typecheck", "test", "spell", "dead-code", "complexity", "yaml-lint", "dockerfile-lint", "file-size", "future-annotations", "py-typed", "commit-lint"] }
image-stats = "python scripts/image_stats.py"
find-passes = "python scripts/find_passes.py"
find-secunda-granule = "op run --account jacquin-family.1password.com --env-file .env.op -- python scripts/find_secunda_granule.py"
download-fixtures = "op run --account jacquin-family.1password.com --env-file .env.op -- python scripts/download_fixtures.py"

[feature.dev.dependencies]
ruff = ">=0.8"
mypy = ">=1.13"
pyright = ">=1.1"
pytest = ">=8"
pre-commit = ">=4"
pillow = ">=10"
types-pyyaml = ">=6"
pytest-cov = ">=5"
typos = ">=1.43"

[feature.dev.pypi-dependencies]
vulture = ">=2.11"
radon = ">=6"
yamllint = ">=1.35"

[environments]
default = { features = ["dev"], solve-group = "default" }
