grid:
  nx: 300
  ny: 300
  nz: 60
  dx: 1000.0
  dy: 1000.0
  dz: 500.0

sky:
  enabled: true
  top_color: [0.03, 0.03, 0.12]
  bottom_color: [0.15, 0.12, 0.18]

ground_plane:
  enabled: true
  opacity: 0.20
  grid_spacing_km: 30.0
  color: [0.35, 0.33, 0.30]

scattering:
  sample_distance: 250.0
  ambient: 0.4
  diffuse: 0.5
  specular: 0.0
  anisotropy: 0.35
  global_illumination_reach: 0.6
  volumetric_scattering_blending: 1.8
  shade: true
  jittering: true

camera:
  rig: orbit
  azimuth_start: 0.0
  azimuth_end: 360.0
  elevation: 30.0
  distance: 600.0
  focal_point: [150.0, 150.0, 30.0]

transfer_function:
  preset: soot

postprocess:
  exposure: 1.4
  bloom_threshold: 0.50
  bloom_intensity: 0.25
  bloom_passes: 3
  fog_density: 0.02
  fog_color: [0.2, 0.2, 0.2]
  tonemap: aces

output:
  width: 1920
  height: 1080
  frames_dir: output/frames
  video_dir: output/video
  vdb_dir: output/vdb
  fps: 24
  bit_depth: 16

encoding:
  codec: h264
  crf: 18
  include_slate: true
  slate_duration_s: 3.0

turbulence:
  enabled: true
  octaves: 6
  lacunarity: 2.0
  gain: 0.5
  amplitude: 0.6
  curl_strength: 0.3
  temporal_speed: 0.02
  seed: 42

plume:
  source_x: 206.0
  source_y: 132.0
  source_z: 5.0
  emission_rate: 1000.0
  stability_class: D
  wind_speed: 5.0
  wind_direction: 270.0
  mixing_height: 1500.0
  stack_height: 200.0

rendering:
  mode: max
  anomaly_max_ppm: 10.0
  absolute_min_ppm: 415.0
  absolute_max_ppm: 435.0
  # Adaptive normalization (disabled by default for backward compatibility)
  adaptive_normalization: false
  adaptive_percentile: 95.0
  min_enhancement_ppm: 1.0
  opacity_gamma: 1.0

motion:
  easing: smoothstep
  tempo_multiplier: 1.0
  camera_drift_speed: 0.0

composition:
  enabled: false
  frame_fill: [0.6, 0.8]
  asymmetric_offset: [0.0, 0.0]
  vertical_emphasis: false
  threshold_fraction: 0.01

annotations:
  facility_name: "Highveld Industrial Corridor"
  region_name: "Mpumalanga — Gauteng"

data_source:
  start_date: "2024-01-15"
  end_date: "2024-01-15"
  domain:
    origin_lat: -26.36
    origin_lon: 28.61
    extent_x_km: 300.0
    extent_y_km: 300.0
    extent_z_km: 15.0
  sources:
    - {name: "Sasol Synfuels", lat: -26.52, lon: 29.17, source_type: industrial}
    - {name: "Johannesburg", lat: -26.20, lon: 28.04, source_type: urban}
    - {name: "Kriel", lat: -26.25, lon: 29.20, source_type: point}
    - {name: "Matla", lat: -26.22, lon: 29.13, source_type: point}
    - {name: "Duvha", lat: -26.09, lon: 29.31, source_type: point}
    - {name: "Kendal", lat: -26.08, lon: 28.95, source_type: point}
    - {name: "Kusile", lat: -25.97, lon: 29.02, source_type: point}
    - {name: "Lethabo", lat: -26.74, lon: 27.97, source_type: point}
    - {name: "Tutuka", lat: -26.79, lon: 29.36, source_type: point}
    - {name: "Hendrina", lat: -26.08, lon: 29.59, source_type: point}
  era5:
    pressure_levels: [1000, 975, 950, 925, 900, 850, 800, 700, 600, 500]
    variables: [u_component_of_wind, v_component_of_wind]
    cache_dir: data/era5
  oco3:
    collection_id: C2237486636-GES_DISC
    cache_dir: data/oco3
    quality_threshold: 0

vdb_export:
  enabled: true
  include_velocity: true
  include_temperature: true
  include_dissolution: true
  t_ambient: 293.0
  t_source: 423.0
  temperature_decay_cells: 50.0
  dissolution_low: 0.05
  dissolution_high: 0.30
