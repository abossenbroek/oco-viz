grid:
  nx: 100
  ny: 100
  nz: 60
  dx: 1000.0
  dy: 1000.0
  dz: 500.0

sky:
  enabled: true
  top_color: [0.01, 0.01, 0.04]
  bottom_color: [0.08, 0.08, 0.12]

ground_plane:
  enabled: true
  opacity: 0.08
  grid_spacing_km: 10.0
  color: [0.3, 0.3, 0.3]

scattering:
  global_illumination_reach: 0.5
  volumetric_scattering_blending: 0.5
  anisotropy: 0.3
  jittering: true
  shade: true
  ambient: 0.3
  diffuse: 0.7
  specular: 0.2

camera:
  rig: orbit
  azimuth_start: 0.0
  azimuth_end: 360.0
  elevation: 30.0
  distance: 300.0
  focal_point: [50.0, 50.0, 30.0]

postprocess:
  fog_density: 0.02
  fog_color: [0.7, 0.75, 0.85]
  tonemap: aces
  bloom_threshold: 0.8
  bloom_intensity: 0.3
  bloom_passes: 3
  exposure: 0.6

output:
  width: 1920
  height: 1080
  frames_dir: output/frames
  video_dir: output/video
  vdb_dir: output/vdb
  fps: 24
  bit_depth: 16

plume:
  source_x: 50.0
  source_y: 10.0
  source_z: 5.0
  emission_rate: 1000.0
  stability_class: D
  wind_speed: 5.0
  wind_direction: 270.0
  mixing_height: 1500.0
  stack_height: 200.0

data_source:
  start_date: "2024-01-15"
  end_date: "2024-01-15"
  domain:
    origin_lat: -26.52
    origin_lon: 29.17
    extent_x_km: 100.0
    extent_y_km: 100.0
    extent_z_km: 15.0
  era5:
    pressure_levels: [1000, 975, 950, 925, 900, 850, 800, 700, 600, 500]
    variables: [u_component_of_wind, v_component_of_wind]
    cache_dir: data/era5
  oco3:
    collection_id: C2237486636-GES_DISC
    cache_dir: data/oco3
    quality_threshold: 0
