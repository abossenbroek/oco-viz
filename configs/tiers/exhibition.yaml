# Exhibition tier: gallery-quality output
sky:
  enabled: false

ground_plane:
  enabled: false

scattering:
  volumetric_scattering_blending: 0.0
  global_illumination_reach: 0.0
  ambient: 0.85
  diffuse: 0.0
  specular: 0.0
  sample_distance: 50.0

postprocess:
  fog_enabled: false
  bloom_enabled: true
  bloom_threshold: 0.55
  bloom_intensity: 0.12
  bloom_passes: 3
  exposure: 8.0
  grain_strength: 0.04

lighting:
  mode: smoldering

motion:
  easing: heavy_ease_in
  tempo_multiplier: 0.3

composition:
  enabled: true
  asymmetric_offset: [0.05, 0.02]
  vertical_emphasis: true
