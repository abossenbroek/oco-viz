# Exhibition tier: gallery-quality output
sky:
  enabled: false

ground_plane:
  enabled: false

scattering:
  volumetric_scattering_blending: 0.0
  global_illumination_reach: 0.0
  ambient: 0.85
  diffuse: 0.0
  specular: 0.0
  sample_distance: 125.0

postprocess:
  fog_enabled: false
  bloom_enabled: false
  exposure: 4.0
  dof:
    enabled: true
    aperture: 2.8
    max_blur_radius: 10.0

lighting:
  mode: smoldering

motion:
  easing: heavy_ease_in
  tempo_multiplier: 0.3

composition:
  enabled: true
  asymmetric_offset: [0.05, 0.02]
  vertical_emphasis: true

particle_dissolution:
  enabled: true
  threshold: 0.05
  particle_count_scale: 1.0

ecd:
  enabled: true
  anomaly_scale: 1.0
