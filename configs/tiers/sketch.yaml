# Sketch tier: fast iteration, minimal rendering
sky:
  enabled: false

ground_plane:
  enabled: false

scattering:
  volumetric_scattering_blending: 0.0
  global_illumination_reach: 0.0
  ambient: 0.5

postprocess:
  fog_enabled: false
  bloom_enabled: false
  exposure: 3.0

lighting:
  mode: basic
