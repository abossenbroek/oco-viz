context:
  key_behavior: |
    ECD data loader and turbulence coupling for exhibition tier.

    ECD data loader: query NASA Earthdata, compute positive/negative deltas.
    ECDConfig: enabled, cache_dir, date_range, anomaly_scale.
    Pipeline integration: attach_ecd_anomaly(ds, ecd_paths) adds ecd_delta variable.
    Turbulence coupling: amplitude *= (1.0 + anomaly_scale * normalized_ecd_delta).

    Exhibition tier overlay: ecd.enabled=true (if data available).
    Graceful fallback: if no ECD data, turbulence runs with static amplitude.
