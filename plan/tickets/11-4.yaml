id: "11-4"
title: "Production VDB Multi-Grid Export"
wave: 11
status: todo
depends: ["7-1", "15-4"]
produces:
  - src/oco_viz/sequencer/vdb_export.py
  - tests/test_vdb_export.py
gates:
  - cmd: "pixi run ruff check src/ tests/"
    expect: exit_0
