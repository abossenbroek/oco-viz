context:
  key_behavior: |
    Current encode.py only outputs H.264 MP4 with hardcoded CRF=18 and
    yuv420p. Professional delivery needs multiple codecs and a title slate.

    PART A: Codec selection (update encode.py)
    Supported codecs, each with sensible ffmpeg defaults:

    1. ProRes 4444 (.mov) — lossless alpha, macOS/DaVinci Resolve
       ffmpeg -r {fps} -i frame_%06d.png -c:v prores_ks -profile:v 4444
       -pix_fmt yuva444p10le output.mov

    2. DNxHR HQX (.mxf) — Avid/broadcast standard
       ffmpeg -r {fps} -i frame_%06d.png -c:v dnxhd -profile:v dnxhr_hqx
       -pix_fmt yuv422p10le output.mxf

    3. H.265/HEVC (.mp4) — better quality-per-bit than H.264
       ffmpeg -r {fps} -i frame_%06d.png -c:v libx265 -crf {crf} output.mp4

    4. H.264 (.mp4) — existing default, widest compatibility
       (keep current behavior as fallback)

    5. PNG sequence — organize frames into numbered directory, no encoding

    encode_video(frames_dir, output_path, config) dispatches on config.codec.
    Add validate_ffmpeg_codec(codec) that checks ffmpeg -codecs output.

    PART B: Title slate generation
    - generate_slate(config) -> list[NDArray]
      Renders a 3-second (fps * 3 frames) title card via PIL:
      Line 1: "Sasol Secunda CO2 Visualization" (large, centered)
      Line 2: date range from config
      Line 3: "Data: NASA OCO-2/3 | ECMWF ERA5 | NOAA GML"
      Line 4: "Generated by oco-viz"
      Background: dark gradient matching cinematic aesthetic
    - Slate frames prepended to PNG sequence before encoding
    - Uses same resolution as render output

    PART C: Add EncodingConfig to schema.py
      codec: str = "h264"  # h264 | h265 | prores4444 | dnxhr_hqx | png
      crf: int = 18
      pixel_format: str | None = None  # auto from codec if None
      include_slate: bool = True
      fps: int = 24

    Add --codec flag to CLI encode command.
  patterns:
    - "FFmpeg subprocess with codec dispatch"
    - "PIL ImageDraw for slate generation"
    - "Config-driven encoding presets"
  related_files:
    - src/oco_viz/sequencer/encode.py
    - src/oco_viz/config/schema.py
    - src/oco_viz/__main__.py
