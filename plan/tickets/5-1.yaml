    Tier-conditional lighting replacing the old configurable light rig.

    LightingMode enum: none (sketch), basic (study), smoldering (exhibition).

    Study mode: current 3-point lighting (key/fill/rim) — keep existing
    apply_lighting(). Camera-tracking rim concept retained as study-mode option.

    Exhibition mode: renderer.RemoveAllLights(), ambient=0.4, diffuse=0.0,
