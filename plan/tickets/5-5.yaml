context:
  key_behavior: |
    Wire all cinematic components into controller.py render loop, then test.

    WIRING (controller.py changes):
    1. Camera dispatch: use CameraPath.from_preset or OrbitCamera
       based on config.camera_path.preset. Factory function:
       create_camera_rig(config) -> CameraPath | OrbitCamera
    2. LightRig: instantiate from config, call update(camera_state)
       per frame before render
    3. Quality mode: apply quality overrides in renderer.configure()
    4. Frame-index seed: pass frame index to grain for temporal variation

    TESTS (test_cinematic_integration.py):
    1. Full pipeline: turbulent plume + storm TF + dramatic lighting +
       reveal camera + full post-processing → produces frames
    2. Storm TF: dark histogram (>60% pixels below 0.3 luminance)
    3. Rim light: edge-region brightness > center brightness
    4. Vignette: corner brightness < center brightness
    5. Camera path: no position discontinuities between frames
    6. Quality modes: preview renders faster than hero
    7. Hero config profile loads and produces valid render
    8. Sequencer resume still works with new camera/lighting

    Expert note: the integration test should verify that lowered per-sample
    opacity + fine sample distance + high GI reach produces translucent
    accumulation (not opaque blob). Check that max pixel brightness > 0.5
    (rim light shines through volume edges).
