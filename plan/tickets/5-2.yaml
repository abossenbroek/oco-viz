context:
  key_behavior: |
    Tier-conditional post-processing pipeline replacing old advanced post-processing.

    Pipeline factory keyed by tier:
      Sketch: passthrough (return raw RGB)
      Study: fog (grey) -> bloom (greyscale) -> ACES tonemap
      Exhibition: ACES tonemap only (DOF added in wave 8)

    Stage enable/disable via PostProcessConfig booleans: fog_enabled, bloom_enabled.
    Bloom retuned for greyscale: use luminance channel for threshold extraction.
    PostProcessPipeline.process(rgb, depth, tier) accepts tier parameter.
    Config-driven: tier overlay sets which stages are active.

    Old 5-2 content (vignette, color grading, film grain) is dropped — Soot uses
    none of these.
  patterns:
    - "Pipeline factory pattern"
    - "Tier-conditional dispatch"
    - "ACES tonemap operator"
