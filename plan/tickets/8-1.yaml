context:
  key_behavior: |
    Exhibition-tier particle dissolution at volume boundaries.

    Boundary detection: identify surface voxels via gradient magnitude thresholding.
    Particle generation: spawn particles at boundary, count scales with surface area.
    Particle rendering: vtkGlyph3D with small spheres, inherit soot TF color/opacity.
    Particles inherit local velocity + slight outward drift + gravity settling.

    ParticleDissolutionConfig: enabled, threshold, particle_count_scale,
    drift_speed, gravity.
    Exhibition tier overlay: particle_dissolution.enabled=true.
    Integration with renderer: add particle actor after volume actor.
  patterns:
    - "vtkGlyph3D for particle rendering"
    - "Gradient magnitude for boundary detection"
    - "Exhibition-tier-only feature"
  related_files:
    - src/oco_viz/render/renderer.py
    - src/oco_viz/render/volume.py
    - src/oco_viz/config/schema.py
    - configs/tiers/exhibition.yaml
